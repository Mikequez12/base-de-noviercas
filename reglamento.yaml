Permiso de entrada:
  - a. Uso de DSR para verificar la entrada:
    - No está permitido de ninguna manera entrar sin la autorización del portero. Puedes intentar pasar autorizado de varias maneras:
    - 1. Enseñar tu DSR:
      - Tu DSR tiene un número de índice y un código QR que determinan que tienes derecho a entrar, si el guardia escanea el QR o ingresa el número de índice en su programa, el programa verificará si tu DSR es válido.
    - 2. Usar la web:
      - En la web, iniciando sesión con tu código de DSR, tienes un código QR que el portero puede interpretar.
    - 3. Autoportero:
      - Si eres empleado; en caso de que no haya ningún portero dentro o el portero no esté disponible, puedes entrar.
  - b. Permiso de entrada en Tours:
      - Cuando hay un tour, debes inscribirte desde la página web, en la sección de tours y debes dar tus credenciales en la base para que te dejen acceder si el día y la hora son correctas junto a las credenciales.
  - c. Permiso de entrada de parking:
      - Es posible que quieras guardar tu bicicleta u otro vehículo. En cuyo caso, solo debes avisar al aparcabicis o al portero. Después, tras una verificación de DSR hecha para conocer si tienes derecho al parking (que puedes demandar en la inscripción) o en la recepción, el aparcabicis se encargará de guardar y proteger tu bicicleta. En caso de que el DSR dictamine que no tienes derecho, tu vehículo será rechazado.
  - ".selector":
      - Administradores
      - Miembros
      - Usuarios
      - Visitantes
Manipulación de DSR:
  - a. Cambios en la tarjeta:
      - Si se detecta cualquier cambio no-autorizado en la tarjeta del DSR, esta se podría retirar por suplantación, falsificación...
  - b. Cambios en la base de datos:
      - Todos los cambios aparecen en nuestros registros, si se encuentra una actividad sospechosa, se comenzará una investigación hasta dar con el culpable, quien será expulsad@ automáticamente (Estos cambios no cuentan en el responsable de las bases de datos).
  - c. Falsificación o copia:
      - Si un DSR resulta ser falso o es una copia no-original, podrás ser vetado de la base hasta 2 semanas. Nos tomamos muy seriamente nuestra seguridad y la de todos los demás, así que recuerda que debes presentarte con las credenciales correctas y verificar su autenticidad.
  - ".selector":
      - Administradores
      - Miembros
      - Usuarios
      - Visitantes
Gestión de objetos:
  - a. Importación y exportación de elementos:
    - Todos los elementos serán inspeccionados antes de su ingreso y de su salida para evitar robos, daños u otras situaciones inconvenientes solo si estos resultan sospechosos para el empleado que realiza la inspección. Estas inspecciones las realizará comunmente el aparcabicis o el portero, aunque todos tienen el derecho de hacerlo.
  - b. Derechos de un sujeto ante una inspección:
    - 1. Todo humano tiene pertenencias privadas que no quiere enseñar. En cuyo caso, puede decir "no quiero enseñar esto". Al evocar la frase, el objeto quedará requisado en la entrada durante toda la visita, aunque no podrá ser aberto ni inspeccionado por nadie más; si esta frase no es evocada, aceptas que tus objetos sean inspeccionados del modo que dicta el apartado 3.
    - 2. Ningún inspector tiene derecho a inspeccionar objetos de rango 1.
    - 3. Los objetos se catalogan en los siguientes rangos:
      - Grado 1 (Intocable por cualquiera):
        - Teléfonos, Tablet, Portátiles, ...
      - Grado 2 (Restricciones marcadas por el visitante):
        - Riñoneras, Mochilas, Carteras, Bolsos, Bolsillos, ...
      - Grado 3 (Irrestrictibles):
        - Bicicleta, Patinete, Skate, Avioneta, ...
      - Grado 4 (Inspecciones rutinarias):
        - Cascos, DSRs, Cámaras, ...
  - ".selector":
      - Miembros
      - Usuarios
      - Visitantes
Agresión:
  - a. Agresión física o/y psicológica:
    - Ningún visitante tiene derecho a agredir a ninguna persona en el recinto, en caso de infringir esta norma, el sujeto se verá obligad@ a abandonar el recinto inmediatamente, deshabilitando el DSR probablemente.
  - ".selector":
    - Administradores
    - Miembros
    - Usuarios
    - Visitantes
Destrucción:
  - a. Destrozar la base:
    - Si un juez decreta que has destrozado una parte de la base a posta, serás expulsado inmediatamente, y tu DSR será deshabilitando en caso de que el juez determine el asalto como un daño grave.
  - ".selector":
    - Administradores
    - Miembros
    - Usuarios
    - Visitantes
Poderes del consejo de empleados:
  - a. Expulsión
    - Si el 70% de la comunidad de empleados opina que un empleado debería ser despedido, se convocará una reunión donde se evaluarán cada una de estas opiniones. Si las opiniones están correctamente justificadas, el empleado será expulsado.
  - ".selector":
    - Administradores
Derechos de los empleados:
  - Todos los empleados tienen el mismo poder. Da igual lo que piense cada uno. Todos los empleados y usuarios tienen toda la libertad de expresión y ninguno será discriminado por libertad de expresión / identidad / género / raza / edad etc.
  - ".selector":
    - Administradores
Derechos de terceros:
  - Toda persona tiene derecho a revisar el reglamento, a hacer preguntas sobre el funcionamento, a pedir ayuda y a comentar todo lo que quiera.
  - ".selector":
    - Miembros
    - Usuarios
    - Visitantes
Carril bici:
  - a. Estorbo:
    - 1. Personas:
      - Ningún sujeto puede estorbar el carril bici. Esta ley se aplica a todos los usuarios, empleados, visitantes... exceptuando al aparcabicis (si este está en su turno y trata de solucionar un problema grave) y al constructor si el carril bici está en obras.
    - 2. Objetos:
      - Está prohibido dejar objetos estorbando el carril bici y su espacio aéreo, pues pueden causar accidentes indeseados.
  - b. Paso peatonal:
    - Todo usuario o visitante puede pasar por un paso de peatones si no hay ningun vehículo circulando. Esta acción de pasar por el cruce, debe ser claramente señalizado al personal de vigiliancia y a todos las personas que circulen en sus vehículos.
  - c. Líneas cortadas:
    - Las líneas cortadas se encuentran en el borde de la intersección del carril bici, que divide la base principal y el parking. Esta línea indica que solo los empleados pueden pasar por ella. En caso de pasar por ella sin querer, puede retroceder y no tendrá nada de qué preocuparse. Esta ley no es válida para los usuarios especiales (Un rol destacado).
  - ".selector":
    - Administradores
    - Miembros
    - Usuarios
    - Visitantes
Seguridad:
  - a. Publicación de datos:
    - No nos hacemos cargo de toda información que comparta un usuario / empleado / visitante; por ende, si alguien comparte su ID de DSR, credencial u otros datos, es responsabilidad de él / ella / ellos. Es posible que alguien comparta su ID de DSR sin querer, en cuyo caso podemos intentar cambiar su ID, sin embargo, recalcamos que este proceso es válido solo una vez, y es un proceso lento y demorado.
  - ".selector":
