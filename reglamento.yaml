Entrada:
  - Reglas generales:
    - Para entrar, se necesita un permiso. Este permiso se llama DSR (Documento de Seguridad Regional), y se puede obtener creando una cuenta en la web.
    - No está permitido de ninguna manera entrar sin la autorización del portero. Puedes intentar pasar autorizado de varias maneras.
  - Verificación del DSR:
    - Para poder entrar es necesario ser verificado.
    - Tienes que enseñar tu DSR, que puede estar como tarjeta o en la web. Ambos tienen un código QR que el portero debe escanear. En caso de no tener esas credenciales, puedes decir tu código DSR, aunque el portero puede hacer más preguntas para verificar tu identidad.
    - En caso de necesitar más servicios, debes pedirselos diréctamente al portero. Puede que él te pida más credenciales (incluso puede ocurrir que te pida volver a iniciar sesión, aunque esto debería ocurrir en actos de sospecha grave). Esto puede ocurrir al querer usar el parking o entrar en un tour entre otros eventos.
  - Incumplimiento:
    - Si tratas de irrumpir forzadamente, pelear contra el portero u obstruir el paso de la entrada ya sea con un objeto o contigo mismo, el guardia de seguridad te escoltará a la salida.
  - Autovalidación:
    - Si eres un empleado y no hay ningún otro empleado que pueda verificar tu identidad en el interior, puedes entrar sin tener que ser verificado.
  - Inspecciones de objetos:
    - El guardia de seguridad, el portero y el aparcabicis pueden inspeccionar tus objetos con algunos detalles. Puede ver todos estos detalles en la sección "inspección de objetos".
  - ".selector":
    - Administradores
    - Miembros
    - Usuarios
    - Visitantes

Inspecciones de seguridad:
  - Sospecha:
    - Si el guardia de seguridad te evalua como sospechoso de una infricción (de cualquier tipo), podrá pedirte credenciales de nuestro sistemas y algunos externos (como DNI, u otra documentación que dictamine su identidad).
    - En caso de ser culpable, aplicará el protocolo, con consecuencias como ser expulsado temporalmente, deshabilitar su DSR entre otras muchas consecuencias...
    - Si solo resulta ser sospechoso pero el guardia de seguridad considera su estancia peligrosa, intimidante o inadecuada, tendrá el derecho total de expulsarlo.
  - Derechos del guardia de seguridad:
    - Un guardia de seguridad no puede agredir en ningún momento ni verbal ni físicamente a nadie a menos que la situación lo requiera específicamente. En caso de presentar una queja, el personal investigará el escenario y los hechos y decidirá si los actos eran necesarios.
    - El guardia puede pedir cualquier acreditación como DSR, IRV e incluso DNI sin antelación si lo encuentra necesario.
    - Puedes ser expulsado sin problemas por un guardia de seguridad.
  - ".selector":
    - Administradores
    - Miembros
    - Usuarios
    - Visitantes

Derechos del usuario ante administradores:
  - Puedes presentar una queja formal sin ningún problema. Esto abrirá una investigación seria para investigar la situación.
  - En caso de que el problema escale, puede pedir un juicio sin problemas. El acusado no puede ser un juez, y si forzosamente tiene que serlo, se puede aplazar a una fecha donde otro administrador esté disponible. Si esto tampoco es posible, el administrador estará obligado a mantener una postura y opinión desinteresada.
  - ".selector":
      - Administradores
      - Miembros
      - Usuarios
      - Visitantes

Manipulación de DSR:
  - Cambios en la tarjeta:
      - Si se detecta cualquier cambio no-autorizado en la tarjeta del DSR, esta se podría retirar por suplantación, falsificación entre muchas otras infricciones.
  - Cambios en la base de datos:
      - Todos los cambios aparecen en nuestras bases de datos, si se encuentra una actividad sospechosa, se comenzará una investigación. Si se encuentra un culpable, este será expulsado automáticamente (Estos cambios no cuentan en el responsable de las bases de datos). Si se sospecha de un cambio desde el lado del cliente sin autorización, se tomarán las mismas medidas.
  - ".selector":
      - Administradores
      - Miembros
      - Usuarios
      - Visitantes

Inspecciones de objetos:
  - Importación y exportación de elementos:
    - Todos los elementos serán inspeccionados antes de su ingreso y de su salida para evitar robos, daños u otras situaciones inconvenientes (solo si estos objetos resultan mínimamente sospechosos para el empleado que realiza la inspección). Estas inspecciones las realizará comunmente el portero, aunque el aparcabicis y guardia de seguridad pueden hacerlo también; si ninguno de los dos está disponible, los demás empleados podrán hacerlo también.
  - Derechos de un sujeto ante una inspección:
    - Todo humano tiene pertenencias privadas que no quiere enseñar. En cuyo caso, puede decir "No quiero enseñar esto". Al pronunciar la frase, el objeto quedará requisado en la entrada durante toda la visita, aunque no podrá ser aberto ni inspeccionado por nadie más; si esta frase no es evocada, aceptas que tus objetos sean inspeccionados de forma cuidadosa pero estricta.
    - Ningún inspector tiene derecho a inspeccionar objetos de rango 1 ni la mayoría de rango 2 (solo si estos son gravemente sospechosos), aunque si el portero rechaza la entrada de algún objeto, este no podrá entrar en la base. En estos casos, el usuario puede pedir al portero que guarde el objeto junto a los objetos requisados para mayor seguridad. Este objeto no será inspeccionado.
    - Los objetos se catalogan en los siguientes rangos:
      - Grado 1 (Intocable por cualquiera):
        - Teléfonos, Tablet, Portátiles, ...
      - Grado 2 (Restricciones marcadas por el visitante):
        - Riñoneras, Mochilas, Carteras, Bolsos, Bolsillos, ...
      - Grado 3 (Irrestrictibles):
        - Bicicleta, Patinete, Skate, Avioneta, ...
      - Grado 4 (Inspecciones rutinarias):
        - Cascos, DSRs, Cámaras, ...
  - ".selector":
      - Administradores
      - Miembros
      - Usuarios
      - Visitantes

Agresión:
  - Agresión física o/y psicológica:
    - Nadie tiene derecho a agredir a otro. En caso de que ocurra una agresión, por favor, acude al guardia de seguridad.
  - ".selector":
    - Administradores
    - Miembros
    - Usuarios
    - Visitantes

Destrucción y obstrucción:
  - Destrozar la base:
    - Tras una destrucción, si un juez decreta que has destrozado una parte de la base a posta, serás expulsado inmediatamente, y tu DSR será deshabilitado en caso de que el juez determine el asalto como un daño grave.
  - Obstrucción de las vías:
    - En caso de obstruir por completo (o parcialmente) una vía (ya sea un paso peatonal, carril bici, puertas, barreras, etc.).
  - ".selector":
    - Administradores
    - Miembros
    - Usuarios
    - Visitantes

Poderes del consejo de empleados:
  - Expulsión
    - Si el 75% de la comunidad de empleados opina que un empleado debería ser despedido, se convocará una reunión donde se evaluarán cada una de estas opiniones. Si las justificaciones son válidas conforme al reglamento, el empleado será expulsado.
  - ".selector":
    - Administradores

Derechos de los empleados:
  - Todos los empleados tienen el mismo poder. Da igual lo que piense cada uno. Todos los empleados y usuarios tienen toda la libertad de expresión y ninguno será discriminado por libertad de expresión / identidad / género / raza / edad etc.
  - ".selector":
    - Administradores

Derechos de terceros:
  - Toda persona tiene derecho a revisar el reglamento, a hacer preguntas sobre el funcionamento, a pedir ayuda y a comentar todo lo que quiera.
  - ".selector":
    - Miembros
    - Usuarios
    - Visitantes

Carril bici:
  - El carril bici está señalizado con piedras en forma de vía, este es el lugar donde pasa el aparcabicis, y está estrictamente prohibido obstruirlo o pasar por ahí sin estar autorizado.
  - ".selector":
    - Administradores
    - Usuarios
    - Visitantes

Seguridad general:
  - Publicación de datos:
    - No nos hacemos cargo de toda información que comparta un usuario / empleado / visitante; por ende, si alguien comparte su DSR, credenciales u otros datos, es responsabilidad de él / ella / ellos.
    - Es posible que alguien comparta su DSR sin querer, en cuyo caso podemos intentar cambiar su DSR, sin embargo, recalcamos que este proceso es válido solo una vez, y es un proceso lento y demorado.
  - Estorbo de entradas o salidas:
    - A menos de que estés autorizado por el guardia de seguridad o el aparcabicis, no podrás estorbar las entradas o salidas (incluyendo por supuesto las de seguridad). Puedes ser expulsado y tu DSR puede ser deshabilitado temporalmente.
  - ".selector":
    - Administradores
    - Miembros
    - Usuarios
    - Visitantes

Barreras:
  - Entrada:
    - Solo pueden acceder usuarios con DSR o usuarios participantes de un tour
  - Parking:
    - Solo puede acceder el aparcabicis
  - Almacén:
    - Solo pueden acceder administradores o miembros
  - Zona de empleados:
    - Solo pueden acceder miembros o administradores
  - salida de emergencias:
    - Solo se puede salir, no se puede entrar
    - Se puede salir durante emergencias
  - ".selector":
    - Administradores
