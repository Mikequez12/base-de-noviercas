<meta name="robots" content="index, follow">
<meta name="description" content="La web oficial de La Base de Noviercas">
<meta charset="utf-8">

<link rel="icon" href="logo.svg" sizes="any" type="image/svg+xml">
<script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>

<title>Cuenta</title>

<logo></logo>

<style>
  @media (max-width: 1000px) {
    #protocols {
      column-count: 1 !important;
    }
    .page:has(>#stats) {
      width: calc(100% - 40px) !important;
    }
  }
  #qrcode {
    border-radius: 5px !important;
    border: solid 2px white;
  }
  #qr-container {
    position: relative;
  }
  #qr-container::after {
    content: '';
    border-radius: 5px;
    position: absolute;
    width: calc(100% + 2px);
    height: calc(100% + 2px);
    background: var(--main-color);
    mix-blend-mode: lighten;
    left: 0;
    top: 0;
    pointer-events: none;
  }
  div.page h2 {
    border-bottom: solid 2px white;
    padding-top: 10px;
    margin-top: 0;
    padding-bottom: 10px;
    margin-bottom: 10px;
    text-align: center;
  }

  #protocol-page {
    padding: 0px;
    margin: auto;
    display: flex;
    flex-direction: column;
    gap: 10px;
    text-align: center;
    align-items: middle;
    justify-content: center;
    margin-top:0;
  }

  #qrcode {
    cursor: pointer;
  }

  #bdd-child div {
    width: 25%;
    min-width: 100px;
    box-shadow: var(--shadow);
    aspect-ratio: 1 / 1;
    background-image: var(--src);
    background-size: contain;
    background-position: center;
    background-repeat: no-repeat;
    border: solid 15px #eee;
    outline: none;
    border-radius: 20px;
    transition: 1s;
    cursor: pointer;
  }
  #bdd-child div:active {
    transform: translateY(3px);
    box-shadow: var(--hidden-shadow);
    transition: .3s ease;
  }
  *:has(>#bdd-child div:hover)>#bdd-child div:not(:hover) {
    opacity: .5;
  }
  #bdd-child {
    width: min-content;
  }
  .tree ul,
  .tree details,
  .tree li,
  .tree * {
    font-size: 20px !important;
  }
  #properties {
    border-collapse: separate;
    table-layout: auto;
    border-spacing: 0 10px;
  }
  #properties th {
    white-space: nowrap;
    text-align: right;
    border-right: solid 1px black;
    padding-right: 5px;
  }
  #properties td {
    padding-left: 5px;
    text-align: left;
  }
  #stats {
    border-spacing: 25px;
  }
  #stats td {
    vertical-align: top; /* para que no se estiren verticalmente */
  }
  #stats td:has(+td) {
      padding-right: 20px;
  }
</style>

<link rel="stylesheet" href="style.css">
<script src="main.js" defer></script>
<script src="account.js" defer></script>
<body class="disablemobile">
<div class="page">
  <h1>
    Tu cuenta
  </h1>
  <div class='page' style="min-width: 500px; width: 50%;">
    <table id="stats">
      <tr>
        <td>
          <table id="properties">
            <tr><th style="font-weight:bold">Nombre y apellidos</th> <td id='name'></td></tr>
            <tr><th style="font-weight:bold">Correo electrónico</th> <td id='mail'></td></tr>
            <tr><th style="font-weight:bold">DSR</th> <td id='dsr'></td></tr>
            <tr><th style="font-weight:bold">Rol</th> <td id='rol'></td></tr>
            <tr><th style="font-weight:bold">Matrícula</th> <td id='matricula'></td></tr>
          </table>
        </td>
        <td id="qr-container">
          <img id='qrcode' alt="Código QR" style="border-radius: 5px; box-shadow:var(--shadow);width: 100%;max-width: 180px;" />
        </td>
      </tr>
    </table>
  </div>
  <h1>
    Participación en tours
  </h1>
  <div class='page' id='tour-participating' style="text-align:center;display:flex">
    <!--- PART -->
  </div>
  <div id='admin-content'>
    <h1 style="margin-bottom: 3px;">
      Herramientas de administradores
    </h1>
    <br>
    <div class='form' id='admin-form'>
      <h2 style="margin: 0;">
        Detección de DSR
      </h2>
      <entry><span>DSR</span><input id="search-dsr" onchange='updateDSRDetector(event)' placeholder=''></entry>
      <entry><span>Nombre y apellidos</span><input id='search-name' onchange='updateDSRDetector(event)' placeholder=''></entry>
      <entry><span>Matrícula</span><input id='search-matricula' onchange='updateDSRDetector(event)' placeholder=''></entry>
      <entry><span>Rol</span><input disabled id='search-rol' onchange='updateDSRDetector(event)' placeholder=''></entry>
      <entry><span>Permiso de parking</span><input disabled id='search-parking' onchange='updateDSRDetector(event)' placeholder=''></entry>
      <button style="background: white; border-color: var(--main-color); color: var(--main-color); width: 100%;" onclick="event.target.parentElement.querySelectorAll('entry > input').forEach(_ => _.value = '');">Limpiar selección</button>
      <a href="qr-code"><button style="width: 100%;">
        Usar código QR
      </button></a>
      <br>
      <h2 style="margin: 0;">
        Lista blanca de tours
      </h2>
      <entry><span>Código de tour</span><input onchange="tourWhitelist(event)" id="tour-code" placeholder=""/></entry>
      <div id="tour-whitelist">
      </div>
      <br>
      <h2 style="margin: 0;">
        BDD y recursos
      </h2>
      <div style='text-align: center; display: flex; justify-content: center;'>
        <a id="bdd-child" href="https://docs.google.com/spreadsheets/d/1RCxdryrlsUn37VZz5UlndUcFWjCUDElhGQMJLTfx6rk/edit"><div style="--src:url(https://upload.wikimedia.org/wikipedia/commons/thumb/a/ae/Google_Sheets_2020_Logo.svg/1200px-Google_Sheets_2020_Logo.svg.png);"></div></a>
        <a id="bdd-child" href="https://dashboard.render.com/web/srv-d14d943ipnbc73f94vkg/settings"><div style="--src:url(https://raw.githubusercontent.com/Mikequez12/others/refs/heads/main/Render.svg);"></div></a>
      </div>
      <br>
      <h2 style="margin-bottom: 3px;">
        Protocolos
      </h2>
      <div id='protocol-page'>
        <div style="display:flex;justify-content:center;align-content:center;">
        </div>
      </div>
    </div>
  </div>
</div>
</body>
<script src="color.js"></script>
