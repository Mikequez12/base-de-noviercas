- Portero:
  - Entrada:
    - Registro al usuario:
      - Visitante de tour:
        - Verifica el nombre y apellidos de los invitados con el de tu dispositivo
        - Trata de hacer que te enseñen pruebas de sus identidades, ya sea mediante DSR o DNI
      - Visitante normal:
        - Verificar DSR:
          - Recuerda verificar que el DSR sea válido
          - Versiones válidas:
            - Web oficial de la base
            - Tarjeta física
            - Código (al habla):
              - Si el usuario te dice su DSR hablando, debe mostrar una credencial (DNI u otro documento).
              - Verifica que los datos del documento coincidan con el DSR y que ambos coincidan con el usuario.
        - Si el DSR no es válido, explica por qué no puede pasar.
        - Si no está registrado, enséñale cómo crear una cuenta en la web y notifíca al DEV.
    - Si trae objetos:
      - Examinar cada objeto por los siguientes criterios:
        - Sospecha - Si el objeto es muy extraño en ese contexto
        - Peligro - Si puede servir para dañar a otros usuarios o a la base
        - Odio - Si el objeto incita al odio a otros usuarios
        - Legalidad - Es un objeto ilegal ya sea dentro o fuera de la base
        - Fragilidad - Si no está garantizado que el objeto esté seguro en la base
        - Sanidad - Si puede tener patógenos (enfermedades, bacterias, ...)
        - Volumen / Peso - Si es un objeto muy grande o muy pesado
        - Distracción - No distrae a ningún trabajador ni incomoda a usuarios
      - Recordar que el usuario se puede negar a las inspecciones.
      - Por cada objeto no inspeccionado o con una inspección fallida:
        - Guardar y proteger en la garita.
    - Si va a usar el parking:
      - Verifica que el usuario sea el aparcabicis, solo él puede acceder al parking por el carril bici
      - Si no es él, llama al aparcabicis, colócate en la barrera del parking y sigue los pasos de esa sección
  - Salida:
    - Registrar el material que trae
    - Registrar su vehículo
    - Notificar sobre los riesgos de pérdida de objetos como moviles y DSR
  - Barrera - Parking (entrada):
    - Pedir DSR del empleado y el IRV del dueño del vehículo
    - Si el DSR es de rango "administrador", dejar pasar
    - Entrar al parking desde la entrada peatonal y darle al aparcabicis una plaza libre
    - Registrar la entrada teniendo en cuenta la plaza ocupada y la fecha y hora actual
  - Barrera - Parking (salida):
    - Pedir DSR del empleado y el IRV del dueño del vehículo
    - Si el DSR es de rango "administrador", dejar salir
    - Dirigirse a la entrada de la base
    - Registrar la salida del vehículo teniendo en cuenta la plaza ocupada y la fecha y hora actual
    - Abrir la puerta al aparcabicis
  - Barrera - Almacén:
    - Pedir DSR del usuario
    - Si el DSR es de rango "administrador" o "miembro", dejar pasar
  - Barrera - Zona de empleados:
    - Pedir DSR del usuario
    - Si el DSR es de rango "administrador", dejar pasar
  - Barrera - Despecho:
    - Si el propietario del despacho no está presente, se puede abrir la barrera.
  - Barrera - Zona de reuniones:
    - Si alguien quiere entrar verifica que sea miembro o administrador.

- Guardia de seguridad:
  - Infricción:
    - Explicar calmadamente la infricción que ha cometido el usuario
    - Ayudar con consejos para evitar este escenario de nuevo
    - Opcionalmente, ayuda decir dónde puede ver el reglamento
    - Si esta infricción se repite recurrentemente con otros usuarios:
      - Convocar una junta con los empleados
      - Explicar las distintas infricciones que han habido
    - Si la infricción se repite recurrentemente en el mismo usuario:
      - Evaluar cómo de importante y necesario es cumplir la regla
      - Evaluar el estado del usuario
      - Si la regla es importante y el usuario está bien:
        - Retener formalmente al usuario
        - Explicar la gravedad de sus actos y posibles consecuencias
        - Si en el reglamento hay adjunta una consecuencia:
          - Aplicar la consecuencia de inmediato
          - Explicar al usuario qué opciones tiene tratando de ayudar
        - Si no hay ninguna consecuencia escrita:
          - Evaluar junto a otros administradores
          - Aplicar la consecuencia decidida
          - Explicar al usuario qué opciones tiene tratando de ayudar

- Aparcabicis:
  - Petición de entrada:
    - Pedir DSR al usuario
    - Verificar que tiene derecho a parking
    - Anotar su IRV (matrícula)
    - Ir a la entrada de la base
    - Mostrar tu DSR al portero, decir el IRV del usuario
    - Esperar a que verifique tus credenciales, y te abra la barrera
    - Esperar dentro del parking hasta que te diga la plaza donde debes colocarte
    - Verificar que anote en la base de datos el vehículo
  - Petición de salida:
    - Pedir DSR al usuario
    - Verificar que el vehículo que demanda está a su nombre
    - Llamar al portero y exigir que te abra la barrera del parking
    - Esperar en la entrada hasta que el portero te abra la puerta

- Guía:
  - Guía para empleados:
    - Mantén un tono formal y serio
    - Aférrate a los puntos de la reunión
    - No se recomienda improvisar
    - Puedes llevar un papel o guión tranquílamente
  - Guía para visitantes:
    - Manten un tono formal pero divertido
    - Revisa los puntos de la reunión
    - Puedes inprovisar sin problemas
    - Puedes llevar notas, pero no guiones a menos que no te sepas nada de tu guión